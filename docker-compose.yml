version: '3.8'

services:
  suencomic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suencomic
    restart: unless-stopped
    ports:
      - "8090:8090"
    dns:
      - 223.5.5.5
      - 119.29.29.29
      - 8.8.8.8
      - 1.1.1.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=8090
      - TZ=Asia/Shanghai
    volumes:
      # 持久化漫画下载目录
      - ./download:/app/download
      # 配置与状态文件（首次部署前先在宿主机创建：
      #   mkdir -p config && touch config/config.json config/tasks.json config/subscriptions.json
      # 代理直接在网页「CONFIG / 系统配置」里填，保存后立即生效）
      - ./config/config.json:/app/config.json
      - ./config/tasks.json:/app/tasks.json
      - ./config/subscriptions.json:/app/subscriptions.json
